<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"backgroundTitle","type":"string","label":"IP 人物背后的标题","default":"从入门到精通","maxLength":18}]'>
<body>
<template>
  <div id="fixed-aroll-opening-title-root" data-composition-id="fixed-aroll-opening-title" data-width="1920" data-height="1080" data-duration="7">
    <div class="paper"></div>
    <div class="stage">
      <div class="hero-ring"></div>
      <div class="hero-title"><span data-field="backgroundTitle" data-var-text="backgroundTitle">从入门到精通</span></div>
      <img class="hero-pose hp1" src="assets/ip-reference/host-explain.png" alt="IP 人物讲解动作">
      <img class="hero-pose hp2" src="assets/ip-reference/host-shrug.png" alt="IP 人物摊手动作">
      <img class="hero-pose hp3" src="assets/ip-reference/host-hero.png" alt="IP 人物正面动作">
      <div class="scratches"></div>
    </div>
  </div>
  <style>
    @font-face{font-family:"PingFang SC";src:local("PingFang SC")}@font-face{font-family:"Microsoft YaHei";src:local("Microsoft YaHei")}
    #fixed-aroll-opening-title-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#f8f7f6;color:#2d3137;font-family:"PingFang SC","Microsoft YaHei",sans-serif}#fixed-aroll-opening-title-root *{box-sizing:border-box}.paper{position:absolute;inset:0;background:radial-gradient(circle at 52% 34%,#fff9,transparent 57%),radial-gradient(#2d313709 .55px,transparent .72px),#f8f7f6;background-size:auto,7px 7px,auto}.stage{position:absolute;left:72px;right:72px;top:82px;height:782px;border:3px solid #2d3137e6;border-radius:30px;background:#fdfaf4;overflow:hidden;box-shadow:0 0 0 8px #fffc,0 18px 34px #2d313726}.hero-title{position:absolute;left:105px;right:105px;top:112px;text-align:center;font-size:112px;font-weight:950;letter-spacing:-.045em;line-height:1.08;z-index:2;opacity:0}.hero-title span{color:#c47f00}.hero-ring{position:absolute;left:50%;top:205px;width:540px;height:540px;border:3px solid #e4a5223d;border-radius:50%;transform:translateX(-50%)}.hero-pose{position:absolute;left:538px;bottom:-165px;width:700px;height:720px;object-fit:contain;z-index:5;opacity:0;filter:drop-shadow(0 18px 18px #2d31371f)}.scratches{position:absolute;inset:0;z-index:28;pointer-events:none;background:linear-gradient(12deg,transparent 16%,rgba(94,98,101,.14) 16.1%,transparent 16.25%),linear-gradient(-22deg,transparent 72%,rgba(129,119,108,.12) 72.1%,transparent 72.25%)}
  </style>
  <script>
    (()=>{const id="fixed-aroll-opening-title",root=document.querySelector('[data-composition-id="'+id+'"]'),tl=gsap.timeline({paused:true});tl.fromTo(root.querySelector('.hero-title'),{opacity:0,y:18},{opacity:1,y:0,duration:.55},.45).set(root.querySelector('.hp1'),{opacity:1},.12).set(root.querySelector('.hp1'),{opacity:0},3.16).set(root.querySelector('.hp2'),{opacity:1},3.16).set(root.querySelector('.hp2'),{opacity:0},4.96).set(root.querySelector('.hp3'),{opacity:1},4.96).to(root.querySelectorAll('.hero-pose'),{y:-7,duration:1.2,yoyo:true,repeat:5},.2).fromTo(root.querySelector('.stage'),{y:2},{y:-2,duration:3.5,yoyo:true,repeat:1,ease:'sine.inOut'},0);window.__timelines=window.__timelines||{};window.__timelines["fixed-aroll-opening-title"]=tl;})();
  </script>
</template>
</body>
</html>
